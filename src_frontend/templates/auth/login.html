{% extends 'base.html' %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h1 class="h3 fw-bold">Welcome to WhoIsWho</h1>
            <p class="text-muted">Secure sign-in with your company SSO</p>
          </div>
          <form method="post" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
              <label for="first_name" class="form-label">First name</label>
              <input type="text" class="form-control" id="first_name" name="first_name" value="Ada" required>
            </div>
            <div class="mb-3">
              <label for="last_name" class="form-label">Last name</label>
              <input type="text" class="form-control" id="last_name" name="last_name" value="Lovelace" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Work email</label>
              <input type="email" class="form-control" id="email" name="email" value="ada.lovelace@whoiswho.dev" required>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">Continue with SSO</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
