{% extends 'base.html' %}

{% block content %}
  <div class="card shadow-sm border-0 rounded-4 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="h4 fw-bold mb-1">Employees</h2>
        <p class="text-muted mb-0">A simple list of current employees</p>
      </div>
      <span class="badge bg-primary-subtle text-primary-emphasis">{{ employees|length }} active</span>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Department</th>
          </tr>
        </thead>
        <tbody>
          {% for employee in employees %}
            <tr>
              <td>{{ employee.name }}</td>
              <td>{{ employee.role }}</td>
              <td>{{ employee.department }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
