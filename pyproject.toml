[project]
name = "whopy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "jsonschema>=4.21,<5",
    "prettytable>=3.9,<4",
    "pandas>=2.2,<3",
    "pydantic>=2.8,<3",      # 2.x only; v3 will break you
    "paramiko>=3,<4",
    "unidecode>=1.3",
    "jinja2>=3.1.4,<4",      # 3.1.4 fixes a known XSS CVE
    "chardet>=5",
    "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whopy*"]